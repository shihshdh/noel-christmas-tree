<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Noël · Grand Luxury Tree</title>
<meta name="theme-color" content="#03060c">
<!-- 开屏：整页加载时播放；地址加 ?nointro 跳过 -->
<script>try{if(!/[?&]nointro\b/.test(location.search))document.documentElement.setAttribute("data-intro","play")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体不阻塞首帧：加载不到就退回系统衬线体 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" media="print" onload="this.media='all'">
<style>
/* ============================================================
   Noël · 视觉系统 —— 沿用 Pixel Reconstruction 的液态玻璃规范
   深夜底 + 香槟金点缀；大圆角、胶囊按钮、顶部高光、指针跟随的光斑。
   动效只动 transform / opacity，缓动只用自然减速。
   ============================================================ */
:root{
  --bg:#03060c;
  --txt:#f6f1e4;
  --txt-2:rgba(246,241,228,.66);
  --txt-3:rgba(246,241,228,.40);
  --glass:rgba(255,255,255,.06);
  --glass-strong:rgba(255,255,255,.11);
  --stroke:rgba(255,232,190,.17);
  --stroke-soft:rgba(255,232,190,.09);
  --gold:#e9c46a;
  --gold-2:#f7e3a1;
  --gold-deep:#b98a2e;
  --ruby:#d63a50;
  --emerald:#2fae7a;
  --r-lg:28px;
  --r-md:18px;
  --r-pill:999px;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --font-round:"MiSans","MiSans VF","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --font-display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --font-serif:"Cormorant Garamond","Cormorant","Georgia","Songti SC",serif;
  --gutter:clamp(16px,3.2vw,44px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font-round);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 55% at 50% 58%,#0f1d27 0%,#060b14 55%,#02040a 100%)}
button{font:inherit;color:inherit}
button:focus-visible,label:focus-within,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 3D 画布 ---------- */
#scene{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.2s var(--ease-soft),transform 2.4s var(--ease);touch-action:none;cursor:grab}
#scene.ready{opacity:1}
#scene.ready.switching{opacity:0;transition:opacity .38s var(--ease-soft)}
#scene.dragging{cursor:grabbing}
#scene canvas{display:block;width:100%;height:100%}
html[data-intro="play"] #scene{transform:scale(1.06)}

/* ---------- 液态玻璃 ---------- */
.glass{position:relative;isolation:isolate;background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.022) 62%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,248,230,.17),inset 0 -1px 0 rgba(0,0,0,.28),0 24px 60px -14px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:radial-gradient(240px circle at var(--mx,50%) var(--my,-60%),rgba(255,222,150,.14),transparent 62%);opacity:0;transition:opacity .4s var(--ease-soft)}
.glass:hover::before{opacity:1}

/* ---------- 顶栏 ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 24px) var(--gutter) 0;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;color:var(--gold);text-decoration:none;white-space:nowrap}
.mark-box{position:relative;display:block;flex:none;width:40px;height:40px}
.mark-box>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.top .brand .mark-box{filter:drop-shadow(0 0 12px rgba(233,196,106,.35))}
.brand-text{display:block}
.brand-name{display:block;font:600 17px/1 var(--font-display);letter-spacing:.24em;color:var(--gold-2)}
.brand small{display:block;font:500 7.5px/1 var(--font-display);letter-spacing:.3em;color:rgba(246,241,228,.56);margin-top:8px}
html[data-intro] .top .brand{opacity:0}
.actions{display:flex;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;cursor:pointer;color:var(--txt-2);transition:color .22s,transform .22s var(--ease),background .22s}
.icon-btn:hover{color:var(--gold-2);transform:translateY(-2px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="true"]{color:var(--gold-2);background:linear-gradient(150deg,rgba(233,196,106,.24),rgba(233,196,106,.06))}

/* ---------- 标题 ---------- */
.hero{position:fixed;left:50%;top:clamp(70px,9vh,110px);transform:translateX(-50%);z-index:10;text-align:center;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none;pointer-events:auto}
.hero.dragging{cursor:grabbing}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;font:500 10px/1 var(--font-display);letter-spacing:.42em;margin-right:-.42em;color:rgba(247,227,161,.72)}
.eyebrow i{width:38px;height:1px;background:linear-gradient(90deg,transparent,rgba(233,196,106,.85))}
.eyebrow i:last-child{background:linear-gradient(270deg,transparent,rgba(233,196,106,.85))}
.hero h1{margin:16px 0 0;font-weight:400;line-height:1}
.h-merry{display:block;font:600 clamp(15px,1.9vw,24px)/1 var(--font-display);letter-spacing:.62em;margin-right:-.62em;color:#f6ebcf;text-shadow:0 0 18px rgba(233,196,106,.35)}
.h-xmas{position:relative;display:block;margin-top:.06em;font:italic 500 clamp(52px,6.6vw,100px)/1.08 var(--font-serif);letter-spacing:.005em;padding:0 .12em}
.h-xmas>span{display:block}
/* 光晕层静态，扫光层只重绘文字本身，互不牵连 */
.h-xmas .glow{position:absolute;inset:0;color:transparent;text-shadow:0 0 26px rgba(233,196,106,.42),0 0 70px rgba(233,160,70,.22),0 2px 3px rgba(0,0,0,.45)}
.h-xmas .ink{position:relative;background:linear-gradient(100deg,#b98a2e 0%,#f7e3a1 20%,#fffaf0 30%,#e9c46a 42%,#b98a2e 58%,#f2d58c 78%,#c8993a 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 11s linear infinite}
@keyframes sheen{from{background-position:130% 0}to{background-position:-110% 0}}

/* ---------- 左侧中控 ---------- */
.dock{position:fixed;left:var(--gutter);top:50%;transform:translateY(-46%);z-index:20;width:296px;border-radius:var(--r-lg);padding:20px 18px 18px;display:flex;flex-direction:column;gap:18px;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-label{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.26em;color:var(--txt-3)}
.sec-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--stroke-soft),transparent)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:var(--r-pill);background:rgba(0,0,0,.3);border:1px solid var(--stroke-soft)}
.seg button{position:relative;z-index:1;border:0;background:none;height:38px;border-radius:var(--r-pill);font-size:13px;letter-spacing:.06em;cursor:pointer;color:var(--txt-2);transition:color .22s var(--ease-soft)}
.seg button:hover{color:var(--txt)}
.seg button[aria-checked="true"]{color:#23180a}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:var(--r-pill);background:linear-gradient(180deg,#f9e7ad,#d7a948);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 6px 20px -4px rgba(233,196,106,.65);transform:translateX(calc(var(--i,0)*100%));transition:transform .38s var(--ease)}
.legend{display:grid;gap:8px}
.legend-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;font-size:12.5px;color:var(--txt-2)}
.legend-row b{font-weight:500;color:var(--txt)}
.legend-row span:last-child{font-size:11.5px;color:var(--txt-3);letter-spacing:.04em}
.chip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:rgba(233,196,106,.09);border:1px solid rgba(233,196,106,.2)}
.chip svg{width:16px;height:16px}
.legend-row.on .chip{background:rgba(233,196,106,.26);color:var(--gold-2);box-shadow:0 0 16px rgba(233,196,106,.35)}
.legend-row.on b{color:var(--gold-2)}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--stroke-soft);background:rgba(255,255,255,.04);cursor:pointer;text-align:left;font-size:13px;color:var(--txt);transition:background .22s,border-color .22s,transform .22s var(--ease)}
.row:hover{background:rgba(255,255,255,.08);border-color:var(--stroke)}
.row:active{transform:scale(.985)}
.row>svg{width:17px;height:17px;flex:none;color:var(--gold)}
.row .meta{margin-left:auto;font-size:11px;color:var(--txt-3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.switch{margin-left:auto;position:relative;width:38px;height:22px;flex:none;border-radius:var(--r-pill);background:rgba(255,255,255,.12);border:1px solid var(--stroke-soft);transition:background .22s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
[aria-checked="true"] .switch{background:linear-gradient(180deg,#f3d27c,#c9982f)}
[aria-checked="true"] .switch::after{transform:translateX(16px)}
.rows{display:grid;gap:8px}
.keys{font-size:11px;line-height:1.9;color:var(--txt-3);letter-spacing:.02em}
kbd{display:inline-block;min-width:20px;padding:0 6px;margin:0 2px;border-radius:6px;border:1px solid var(--stroke-soft);background:rgba(255,255,255,.05);font:500 10.5px/18px var(--font-round);text-align:center;color:var(--txt-2)}

/* ---------- 摄像头 + 状态 ---------- */
.side{position:fixed;right:var(--gutter);bottom:calc(env(safe-area-inset-bottom) + clamp(16px,3vh,32px));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:10px;transition:opacity .5s var(--ease)}
.hint{display:flex;align-items:center;gap:10px;min-height:38px;max-width:320px;padding:8px 16px 8px 14px;border-radius:var(--r-pill);font-size:12.5px;color:var(--txt-2)}
.hint .dot{width:7px;height:7px;border-radius:50%;flex:none;background:#8b8f98;box-shadow:0 0 0 3px rgba(139,143,152,.18)}
.hint[data-state="ok"] .dot{background:#7fd6a4;box-shadow:0 0 12px #7fd6a4}
.hint[data-state="load"] .dot{background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.hint[data-state="err"] .dot{background:#ff6b6b;box-shadow:0 0 10px #ff6b6b}
.hint[data-state="live"] .dot{background:var(--gold-2);box-shadow:0 0 14px var(--gold)}
@keyframes pulse{50%{opacity:.35}}
.cam{width:252px;padding:7px;border-radius:var(--r-md);transition:opacity .38s var(--ease-soft),transform .45s var(--ease)}
.cam.off{opacity:0;transform:translateY(14px) scale(.97);pointer-events:none;position:absolute;bottom:0}
.cam canvas{display:block;width:100%;aspect-ratio:4/3;border-radius:12px;background:#000}
#webcam-video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- 提示条 ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 34px);z-index:40;padding:11px 22px;border-radius:var(--r-pill);font-size:13px;letter-spacing:.08em;color:var(--gold-2);opacity:0;transform:translate(-50%,12px);transition:opacity .38s var(--ease-soft),transform .5s var(--ease);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.long{white-space:normal;width:max-content;max-width:min(90vw,520px);text-align:center;line-height:1.6;border-radius:22px;color:var(--txt)}

/* ---------- 进场与隐藏 ---------- */
.reveal{transition:opacity .9s var(--ease) var(--d,0s),translate .9s var(--ease) var(--d,0s)}
html[data-intro="play"] .reveal{opacity:0;translate:0 14px}
body.ui-off .dock{opacity:0;transform:translate(-24px,-46%);pointer-events:none}
body.ui-off .side{opacity:0;pointer-events:none}
body.ui-off .hero{opacity:.001;pointer-events:none}
.hero{transition:opacity .5s var(--ease-soft)}

/* ---------- 录像 ---------- */
#titles{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s var(--ease-soft)}
#titles.on{opacity:1}
.icon-btn.rec{color:#ff8a8a}
.icon-btn.rec[aria-pressed="true"]{color:#fff;background:linear-gradient(150deg,rgba(255,77,94,.55),rgba(255,77,94,.2))}
.rec-pill{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 26px);transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:12px;height:42px;padding:0 20px;border-radius:var(--r-pill);font-size:13px;letter-spacing:.06em;color:var(--txt);cursor:pointer}
.rec-pill[hidden]{display:none}
.rec-pill .dot{width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 12px #ff4d5e;animation:pulse 1.2s ease-in-out infinite}
#rec-time{font-variant-numeric:tabular-nums;font-weight:600}
#rec-label{color:var(--txt-2)}
body.recording .dock,body.recording .hero{opacity:0;pointer-events:none}
body.recording .actions>:not(#btn-rec){opacity:.35}
.rec-saved{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);z-index:41;display:flex;align-items:center;gap:12px;max-width:min(92vw,820px);padding:8px 8px 8px 20px;border-radius:var(--r-pill);font-size:13px;color:var(--txt);opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .38s var(--ease-soft),transform .5s var(--ease)}
.rec-saved.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#rec-saved-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-saved button{flex:none;height:32px;padding:0 14px;border:0;border-radius:var(--r-pill);background:rgba(255,255,255,.12);color:var(--txt);cursor:pointer;font-size:12.5px}
.rec-saved button:hover{background:rgba(233,196,106,.35)}
#rec-open{background:linear-gradient(180deg,#f9e7ad,#d7a948);color:#23180a}
#rec-open[hidden]{display:none}

/* ---------- 照片墙 ---------- */
.gallery{position:fixed;right:var(--gutter);top:calc(env(safe-area-inset-top) + 88px);bottom:calc(env(safe-area-inset-bottom) + 24px);width:392px;z-index:25;border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .38s var(--ease-soft),transform .5s var(--ease)}
.gallery.open{opacity:1;transform:none;pointer-events:auto}
body.g-open .side{opacity:0;pointer-events:none}
.g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.g-title{font:600 15px/1.2 var(--font-display);letter-spacing:.22em;color:var(--gold-2)}
.g-sub{margin-top:7px;font-size:11.5px;line-height:1.5;color:var(--txt-3)}
.g-close{width:36px;height:36px;flex:none}
.g-close svg{width:16px;height:16px}
.g-upload{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:var(--r-md);cursor:pointer;font-size:14px;letter-spacing:.06em;color:#23180a;background:linear-gradient(180deg,#f9e7ad,#d7a948);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 24px -8px rgba(233,196,106,.7);transition:transform .22s var(--ease)}
.g-upload:hover{transform:translateY(-1px)}
.g-upload:active{transform:scale(.985)}
.g-upload small{font-size:11px;opacity:.7;letter-spacing:0}
.g-upload svg{width:18px;height:18px}
.g-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.g-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;padding-right:2px;scrollbar-width:thin;scrollbar-color:rgba(233,196,106,.3) transparent}
.g-grid:empty{display:none}
.g-item{position:relative;margin:0;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.3);border:1px solid var(--stroke-soft)}
.g-item img{width:100%;height:100%;object-fit:cover;display:block}
.g-idx{position:absolute;left:6px;top:6px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.55);font-size:10.5px;line-height:20px;text-align:center;color:var(--txt-2)}
.g-item figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;padding:20px 5px 6px;background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:0;transform:translateY(6px);transition:opacity .22s var(--ease-soft),transform .3s var(--ease)}
.g-item:hover figcaption,.g-item:focus-within figcaption{opacity:1;transform:none}
@media(hover:none){.g-item figcaption{opacity:1;transform:none}}
.g-item figcaption>*{position:relative;flex:1;height:26px;border:0;border-radius:999px;background:rgba(255,255,255,.16);font-size:11px;line-height:26px;text-align:center;color:#fff;cursor:pointer;overflow:hidden;transition:background .2s}
.g-item figcaption>*:hover{background:rgba(233,196,106,.45)}
.g-item figcaption [data-act=del]:hover{background:rgba(214,58,80,.65)}
.g-item figcaption input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.g-empty{flex:1;display:grid;place-items:center;padding:20px;text-align:center;font-size:12.5px;line-height:1.9;color:var(--txt-3);border:1px dashed var(--stroke);border-radius:var(--r-md)}
.g-empty[hidden]{display:none}
.g-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--txt-3)}
.g-clear{border:0;background:none;color:var(--txt-3);cursor:pointer;font-size:11.5px;padding:6px 10px;border-radius:999px;transition:background .2s,color .2s}
.g-clear:hover{color:#ff9a9a;background:rgba(214,58,80,.12)}
.g-clear.confirm{color:#fff;background:rgba(214,58,80,.72)}
.g-clear[hidden]{display:none}
.drop{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(3,6,12,.5);opacity:0;pointer-events:none;transition:opacity .25s var(--ease-soft)}
body.dropping .drop{opacity:1}
.drop-inner{padding:26px 40px;border-radius:var(--r-lg);font-size:16px;letter-spacing:.12em;color:var(--gold-2);border-style:dashed}
@media(max-width:760px){
  .gallery{left:12px;right:12px;top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px);height:74vh;width:auto;transform:translateY(24px);padding:14px}
  .g-foot span{display:none}
}

/* ============================================================
   开屏：四片挂饰从屏幕四角飞来落定 → 树形轮廓从树尖向两侧描下 →
   填色、星芒一闪 → 标志让位、字标逐字浮现 → 整体飞进顶栏，场景在下面展开
   ============================================================ */
#intro{position:fixed;inset:0;z-index:100;display:none;overflow:hidden;color:var(--gold);user-select:none;-webkit-user-select:none;cursor:pointer}
html[data-intro] #intro{display:block}
.i-backdrop{position:absolute;inset:0;background:radial-gradient(ellipse 85% 75% at 50% 46%,#0e1c27 0%,#070d17 52%,#020409 100%)}
.i-snow{position:absolute;inset:0;pointer-events:none}
.i-snow i{position:absolute;top:-3vh;border-radius:50%;background:#fff;opacity:0}
.i-glow{position:absolute;left:50%;top:50%;width:min(96vw,980px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(233,196,106,.17),rgba(233,196,106,.05) 46%,transparent);opacity:0;pointer-events:none}
.i-flight{position:absolute;inset:0;transform-origin:0 0;pointer-events:none}
.i-stage{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;transform:scale(3.2)}
.i-zoom,.i-slide{position:absolute;left:0;top:0;transform-origin:0 0}
.i-lockup{position:absolute;left:-20px;top:0;margin:0;transform:translateY(-50%)}
.i-lockup .real{opacity:0}
.parts{position:absolute;inset:0}
.parts>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pc{position:absolute;display:block;opacity:0}
.pc-ball{border-radius:50%}
.pc-ball.g{background:radial-gradient(ellipse 78% 78% at 36% 30%,#fff7da 0%,#f3d27c 28%,#b98a2e 70%,#5e3d0d 100%)}
.pc-ball.r{background:radial-gradient(ellipse 78% 78% at 36% 30%,#ffd6dc 0%,#e8475f 26%,#93122a 70%,#3d0511 100%)}
.pc-ball.p{background:radial-gradient(ellipse 78% 78% at 36% 30%,#ffffff 0%,#f4ead9 32%,#bfae93 75%,#6e604b 100%)}
.pc-star svg{display:block;width:100%;height:100%;overflow:visible}
.burst,.rays{position:absolute;left:50%;top:15.625%;translate:-50% -50%;pointer-events:none;opacity:0}
.burst{width:130%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,250,228,.95),rgba(247,214,130,.55) 30%,rgba(233,196,106,.12) 60%,transparent)}
.rays{width:230%;aspect-ratio:1}
.rays svg{display:block;width:100%;height:100%}
.glint{position:absolute;inset:0;overflow:hidden;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.glint>i{position:absolute;top:-20%;bottom:-20%;left:-60%;width:60%;display:block;background:linear-gradient(100deg,transparent 0%,#fff8e0 45%,#ffffff 52%,transparent 100%);opacity:0}
.ltr{display:inline-block;opacity:0}
.slit{display:block;overflow:hidden}
.slit>span{display:block;transform:translateY(105%)}
.i-skip{position:absolute;top:calc(env(safe-area-inset-top) + 24px);right:var(--gutter);height:44px;padding:0 20px;border-radius:var(--r-pill);font-size:12px;letter-spacing:.14em;color:var(--txt-2);cursor:pointer;opacity:0}
.i-skip span{margin-left:12px;font-size:15px}

@media(min-width:1600px){.i-stage{transform:scale(3.7)}}
@media(max-width:1023px){.i-stage{transform:scale(2.6)}}
@media(max-width:760px){
  .i-stage{transform:scale(2.1)}
  .top{padding-top:calc(env(safe-area-inset-top) + 16px)}
  .mark-box{width:34px;height:34px}
  .brand-name{font-size:15px}
  .brand small{font-size:6.5px;margin-top:6px}
  .i-lockup{left:-17px}
  .icon-btn{width:40px;height:40px}
  .hero{top:calc(env(safe-area-inset-top) + 76px)}
  .eyebrow{font-size:8px;letter-spacing:.3em}
  .eyebrow i{width:22px}
  .h-xmas{font-size:clamp(44px,14vw,64px)}
  .dock{left:12px;right:12px;top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px);width:auto;transform:none;padding:14px;gap:12px;border-radius:24px}
  body.ui-off .dock{transform:translateY(24px)}
  .legend,.keys,.sec-label.opt{display:none}
  .rows{grid-template-columns:1fr 1fr}
  .row{min-height:42px;padding:0 12px;font-size:12px;gap:9px}
  .row .meta,.row .switch{display:none}
  .row[aria-checked="true"]{border-color:rgba(233,196,106,.5);background:rgba(233,196,106,.14)}
  .side{top:calc(env(safe-area-inset-top) + 72px);bottom:auto;right:12px}
  .hint{display:none}
  .cam{width:120px;padding:4px;border-radius:14px}
  .cam canvas{border-radius:10px}
  .toast{bottom:auto;top:calc(env(safe-area-inset-top) + 200px)}
}
@media(max-height:620px) and (min-width:761px){.legend,.keys{display:none}.dock{gap:12px}}

@media(prefers-reduced-motion:reduce){
  .h-xmas .ink{animation:none;background-position:50% 0}
  #scene,.dock,.cam,.toast,.reveal{transition-duration:.2s}
  html[data-intro="play"] #scene{transform:none}
  .hint[data-state="load"] .dot{animation:none}
}

<body>

<div id="scene" aria-label="3D 圣诞树，可拖动旋转"></div>

<header class="top">
  <a class="brand" id="brand" href="?nointro" title="Noël · Grand Luxury Tree">
    <span class="mark-box"><span data-mark="mark"></span></span>
    <span class="brand-text"><span class="brand-name">NOËL</span><small>GRAND LUXURY TREE</small></span>
  </a>
  <div class="actions reveal" style="--d:.15s">
    <button class="icon-btn glass rec" id="btn-rec" aria-pressed="false" title="录像 (R)：先播片头，点击结束后播片尾">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/></svg>
      <span class="sr">录像</span>
    </button>
    <button class="icon-btn glass" id="btn-music" aria-pressed="false" title="背景音乐">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
      <span class="sr">背景音乐</span>
    </button>
    <button class="icon-btn glass" id="btn-ui" aria-pressed="false" title="隐藏界面 (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="sr">隐藏界面</span>
    </button>
    <button class="icon-btn glass" id="btn-fs" aria-pressed="false" title="全屏 (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="sr">全屏</span>
    </button>
  </div>
</header>

<div class="hero reveal" id="hero" style="--d:.05s" title="拖动可移动标题，双击复位">
  <div class="eyebrow"><i></i>MMXXVI · A CHRISTMAS EVENING<i></i></div>
  <h1><span class="h-merry">MERRY</span><span class="h-xmas"><span class="glow" aria-hidden="true">Christmas</span><span class="ink">Christmas</span></span></h1>
</div>

<aside class="dock glass reveal" id="dock" style="--d:.25s" aria-label="交互中控">
  <div class="sec">
    <div class="sec-label">形态</div>
    <div class="seg" role="radiogroup" aria-label="形态" id="seg">
      <span class="seg-ind"></span>
      <button role="radio" aria-checked="true" data-mode="TREE">聚合成树</button>
      <button role="radio" aria-checked="false" data-mode="SCATTER">散作星河</button>
      <button role="radio" aria-checked="false" data-mode="HOLDING">取出照片</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-label">背景</div>
    <div class="seg" role="radiogroup" aria-label="背景" id="bg-seg">
      <span class="seg-ind"></span>
      <button role="radio" aria-checked="false" data-bg="night">夜空</button>
      <button role="radio" aria-checked="false" data-bg="forest">森林</button>
      <button role="radio" aria-checked="true" data-bg="city">时代广场</button>
    </div>
  </div>
  <div class="sec legend" id="legend">
    <div class="legend-row" data-g="OPEN"><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 11V6M10 10V4M13 10V4.5M16 11V6.5"/><path d="M5 12.5c0 4 2.7 7.5 7 7.5s6.5-3 6.5-7V10"/></svg></span><b>张开手掌</b><span>聚合 · 左右移动转树</span></div>
    <div class="legend-row" data-g="FIST"><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="7" width="12" height="11" rx="4"/><path d="M6 11h12M10 7v4M14 7v4"/></svg></span><b>握拳</b><span>散作星河</span></div>
    <div class="legend-row" data-g="PINCH"><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 16a5 5 0 0 1 0-8M16 8a5 5 0 0 1 0 8"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg></span><b>捏合</b><span>取出一张照片</span></div>
  </div>
  <div class="sec">
    <div class="sec-label opt">素材与互动</div>
    <div class="rows">
      <button class="row" id="row-photo" aria-expanded="false" aria-controls="gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 15-4.5-4.5L8 19"/></svg>
        照片墙<span class="meta" id="photo-meta">上传 · 替换 · 保存</span>
      </button>
      <button class="row" id="row-cam" role="switch" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="m15 10.5 6-3.5v10l-6-3.5"/></svg>
        手势摄像头<span class="switch"></span>
      </button>
      <label class="row" id="row-music-file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        上传音乐<span class="meta" id="music-meta">灯光随节拍律动</span>
        <input type="file" id="music-input" accept="audio/*">
      </label>
      <button class="row" id="row-music" role="switch" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
        播放音乐<span class="switch"></span>
      </button>
      <button class="row" id="row-snow" title="积雪会慢慢变厚，点击清扫">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></svg>
        积雪<span class="meta" id="snow-meta">正在飘雪</span>
      </button>
      <button class="row" id="row-fsr" role="switch" aria-checked="false" title="低分辨率渲染后放大并锐化，省显卡">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="12" width="9" height="9" rx="1.5"/><path d="M12 3h9v9M15 9l6-6"/></svg>
        超分辨率<span class="switch"></span>
      </button>
    </div>
  </div>
  <div class="keys"><kbd>Space</kbd>聚合 <kbd>Z</kbd>散开 <kbd>X</kbd>照片 <kbd>P</kbd>照片墙 <kbd>B</kbd>背景 <kbd>R</kbd>录像 <kbd>H</kbd>隐藏 <kbd>F</kbd>全屏<br>拖动画面可旋转圣诞树 · 照片可直接拖进窗口</div>
</aside>

<section class="gallery glass" id="gallery" aria-label="照片墙" aria-hidden="true">
  <header class="g-head">
    <div><div class="g-title">照片墙</div><div class="g-sub" id="g-sub">还没有照片 · 会保存在本机浏览器里</div></div>
    <button class="icon-btn glass g-close" id="g-close" title="关闭 (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="sr">关闭</span></button>
  </header>
  <label class="g-upload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    上传照片<small>可一次选多张</small>
    <input type="file" id="photo-input" multiple accept="image/*">
  </label>
  <div class="g-grid" id="g-grid"></div>
  <div class="g-empty" id="g-empty">点上面的按钮，或把照片直接拖进窗口<br>树上的相框会换成你的照片</div>
  <footer class="g-foot"><span>悬停照片可查看、替换、删除</span><button class="g-clear" id="g-clear" hidden>全部清空</button></footer>
</section>
<div class="drop" id="drop"><div class="drop-inner glass">松手，把照片挂到树上</div></div>

<div class="side reveal" id="side" style="--d:.35s">
  <div class="cam glass off" id="cam"><canvas id="webcam-canvas" width="640" height="480"></canvas></div>
  <div class="hint glass" id="hint" data-state="load" role="status" aria-live="polite"><span class="dot"></span><span id="hint-text">正在点亮圣诞树…</span></div>
</div>
<video id="webcam-video" autoplay playsinline muted></video>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<canvas id="titles" aria-hidden="true"></canvas>
<button class="rec-pill glass" id="rec-pill" hidden><span class="dot"></span><span id="rec-time">00:00</span><span id="rec-label">点击结束录制</span></button>
<div class="rec-saved glass" id="rec-saved" role="status" aria-live="polite">
  <span id="rec-saved-text"></span>
  <button type="button" id="rec-open" hidden>打开文件夹</button>
  <button type="button" id="rec-saved-close" aria-label="关闭">×</button>
</div>

<div id="intro" aria-hidden="true">
  <div class="i-backdrop" id="i-backdrop"></div>
  <div class="i-snow" id="i-snow"></div>
  <div class="i-glow" id="i-glow"></div>
  <div class="i-flight" id="i-flight">
    <div class="i-stage">
      <div class="i-zoom" id="i-zoom">

</div>

// ---------------- 天空：深夜渐变 + 远山 + 极光 + 月亮 + 树后暖光 ----------------
const MOON_DIR = new THREE.Vector3(-0.457, 0.225, -0.86).normalize();
// ---------------- 背景：夜空 / 森林 / 时代广场，三种可切换；雪花和雪地一直都在 ----------------
const THEMES = ['night', 'forest', 'city'];
const THEME_TEXT = { night: '夜空', forest: '雪松森林', city: '时代广场' };
// 每种背景的天边色（雾色与之一致，雪地远端才能无缝融进夜色）与雾浓度
const THEME_LOOK = {
  night: { hor: [0.022, 0.026, 0.042], fog: 0.0042 },
  forest: { hor: [0.022, 0.026, 0.042], fog: 0.0058 },
  city: { hor: [0.05, 0.036, 0.052], fog: 0.0034 }
};
let theme = (() => { try { const t = localStorage.getItem('noel-theme'); return THEMES.includes(t) ? t : 'city'; } catch (e) { return 'city'; } })();
if (THEMES.includes(qs.get('bg'))) theme = qs.get('bg');
let skyMat = null, cityGroup = null, forestGroup = null, bokehPts = null;

function buildSky() {
  skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uTime: U.uTime, uMoonDir: { value: MOON_DIR }, uTheme: { value: 2 }, uHor: { value: new THREE.Vector3(0.05, 0.036, 0.052) } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime, uTheme; uniform vec3 uMoonDir, uHor; varying vec3 vDir;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y, az = atan(d.x, -d.z);
        bool city = uTheme > 1.5, forest = uTheme > 0.5 && uTheme < 1.5;
        vec3 top = city ? vec3(0.003, 0.004, 0.012) : vec3(0.002, 0.005, 0.014);
        vec3 mid = city ? vec3(0.012, 0.014, 0.032) : vec3(0.008, 0.02, 0.04);
        vec3 hor = uHor;
        vec3 col = mix(hor, mid, smoothstep(-0.08, 0.22, h));
        col = mix(col, top, smoothstep(0.22, 0.85, h));
        // 树背后的一团暖光
        col += vec3(0.16, 0.085, 0.03) * pow(max(dot(d, normalize(vec3(0.0, 0.1, -1.0))), 0.0), 5.0) * (city ? 0.26 : 0.4);
        if (city) {
          // 城市上空只剩被灯光映亮的低云
          col += vec3(0.07, 0.035, 0.05) * exp(-max(h, 0.0) * 7.0) * 0.6;
        } else {
          // 极光：三层沿方位角起伏的光帘，带竖向细纹，缓慢流动（森林里明显，夜空里淡淡一层）
          float t = uTime * 0.04, curtain = 0.0;
          for (int i = 0; i < 3; i++) {
            float fi = float(i);
            float base = 0.16 + 0.05 * fi + 0.035 * sin(az * (1.3 + fi * 0.7) + t * (1.0 + fi) + fi * 2.0);
            float band = smoothstep(base - 0.03, base + 0.01, h) * (1.0 - smoothstep(base + 0.02, base + 0.22 - fi * 0.03, h));
            float fold = noise(vec2(az * (6.0 + fi * 3.0) + t * 2.0, fi * 7.0 + t));
            float rays = 0.55 + 0.45 * noise(vec2(az * 90.0 + fi * 13.0, t * 3.0));
            curtain += band * smoothstep(0.35, 0.85, fold) * rays * (1.0 - fi * 0.25);
          }
          vec3 aur = mix(vec3(0.05, 0.55, 0.32), vec3(0.35, 0.2, 0.6), smoothstep(0.2, 0.42, h));
          col += aur * curtain * smoothstep(-0.2, 0.9, sin(az * 0.9 + 0.8)) * (forest ? 0.085 : 0.035);
        }
        // 月亮：带月海明暗的圆盘 + 两层月晕
        float md = dot(d, uMoonDir);
        vec3 mx = normalize(cross(uMoonDir, vec3(0.0, 1.0, 0.0)));
        vec2 mp = vec2(dot(d, mx), d.y - uMoonDir.y) * 900.0;
        float maria = 0.82 + 0.18 * noise(mp * 0.9) - 0.1 * noise(mp * 2.3);
        col += vec3(0.45, 0.52, 0.7) * pow(max(md, 0.0), 900.0) * 0.5 + vec3(0.12, 0.15, 0.24) * pow(max(md, 0.0), 60.0) * 0.35;
        col = mix(col, vec3(2.4, 2.3, 2.1) * maria, smoothstep(0.99966, 0.99976, md));
        if (forest) {
          // 远山两层：远的淡、近的深，朝月的一侧山脊被勾出雪线
          float r2 = 0.07 + 0.028 * sin(az * 1.7 + 2.2) + 0.016 * sin(az * 4.3 + 0.3) + 0.008 * sin(az * 9.7 + 1.1) + 0.004 * sin(az * 21.0);
          float r1 = 0.042 + 0.022 * sin(az * 2.3 + 0.7) + 0.013 * sin(az * 5.1 + 1.9) + 0.007 * sin(az * 11.3 + 0.4) + 0.0035 * sin(az * 23.7 + 2.0);
          float lit = 0.6 + 0.4 * max(dot(normalize(vec2(d.x, -d.z)), normalize(vec2(uMoonDir.x, -uMoonDir.z))), 0.0);
          if (h < r2) { float e = smoothstep(r2 - 0.018, r2, h); col = mix(col, mix(vec3(0.03, 0.036, 0.058), vec3(0.075, 0.085, 0.12) * lit, e), 0.9); }
          if (h < r1) { float e = smoothstep(r1 - 0.012, r1, h); col = mix(vec3(0.014, 0.018, 0.03), vec3(0.06, 0.068, 0.098) * lit, e * 0.85); }
        }
        // 最低处融进雾色，与雪地远端无缝相接
        col = mix(col, hor, smoothstep(0.02, -0.03, h));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(520, 64, 32), skyMat);
  sky.renderOrder = -10;
  scene.add(sky);
}

// ---------------- 森林：一层层下垂、带锯齿枝梢的雪松，三种树形；林间木屋亮着窗 ----------------
// 每棵树由 8–12 层“裙摆”叠成：每层是一圈向外下垂的枝丫，枝梢长短、下垂程度各不相同
function conifer(tiers, radius, jag, seed) {
  let s = seed;
  const rr = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const pos = [], col = [], seg = 16;
  const base = new THREE.Color('#0b2a1d'), tip = new THREE.Color('#1c4a32'), trunk = new THREE.Color('#2a1a10');
  const push = (p, c) => { pos.push(p[0], p[1], p[2]); col.push(c.r, c.g, c.b); };
  // 树干
  for (let k = 0; k < 8; k++) {
    const a0 = k / 8 * 6.283, a1 = (k + 1) / 8 * 6.283, r = 0.045;
    const p = (a, y) => [Math.cos(a) * r, y, Math.sin(a) * r];
    push(p(a0, 0), trunk); push(p(a1, 0), trunk); push(p(a1, 0.2), trunk);
    push(p(a0, 0), trunk); push(p(a1, 0.2), trunk); push(p(a0, 0.2), trunk);
  }
  for (let t = 0; t < tiers; t++) {
    const f = t / tiers;
    const yTop = 0.12 + (t + 1.35) / tiers * 0.88, yBot = 0.1 + f * 0.86;
    const rb = radius * Math.pow(1 - f, 0.95) * (0.9 + rr() * 0.2) + 0.03;
    const ring = [];
    for (let k = 0; k <= seg; k++) {
      const a = k / seg * 6.283 + t * 0.37, j = 1 - jag * rr();
      const droop = (0.03 + rr() * 0.05) * (1 - f * 0.5);
      ring.push([Math.cos(a) * rb * j, yBot - droop * j, Math.sin(a) * rb * j]);
    }
    const apex = [0, Math.min(1, yTop), 0], inner = [0, yBot + 0.02, 0];
    const c0 = base.clone().lerp(tip, 0.3 + 0.5 * f), c1 = base.clone().lerp(tip, 0.1 + 0.3 * f);
    for (let k = 0; k < seg; k++) {
      push(apex, c0); push(ring[k + 1], c1); push(ring[k], c1);      // 外侧斜面（积雪落在这里）
      push(inner, base); push(ring[k], base); push(ring[k + 1], base); // 裙摆底面
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}
function buildForestScene() {
  const group = new THREE.Group(); scene.add(group);
  const mat = withSnowCap(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, envMapIntensity: 0.4 }), 0.62, 0.55, 0.88, 'forest2');
  const variants = [conifer(10, 0.5, 0.35, 11), conifer(12, 0.42, 0.45, 23), conifer(8, 0.56, 0.3, 37)];
  const total = GPU.discrete ? 1500 : 480;
  const meshes = variants.map(g => { const m = new THREE.InstancedMesh(g, mat, Math.ceil(total / variants.length)); m.count = 0; group.add(m); return m; });
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let k = 0; k < total;) {
    // 近处稀、远处密；镜头前方留出视野
    const a = rnd() * Math.PI * 2, r = 50 + Math.pow(rnd(), 0.7) * 160;
    const x = Math.sin(a) * r, z = Math.cos(a) * r;
    if (z > 0 && Math.abs(x) < z * 1.1 + 18) continue;
    const h = R(7, 17) * (0.8 + r / 380);
    s.set(h * R(0.85, 1.15), h, h * R(0.85, 1.15));
    q.setFromEuler(new THREE.Euler(R(-0.03, 0.03), rnd() * 6.28, R(-0.03, 0.03)));
    p.set(x, FLOOR_Y - 0.2, z);
    const mesh = meshes[k % meshes.length];
    mesh.setMatrixAt(mesh.count++, m4.compose(p, q, s));
    k++;
  }
  meshes.forEach(m => { m.instanceMatrix.needsUpdate = true; m.computeBoundingSphere(); });
  // 林间木屋：积雪的坡屋顶，窗里透出暖光
  const wood = new THREE.MeshStandardMaterial({ color: 0x3a2416, roughness: 0.85 });
  const roofM = withSnowCap(new THREE.MeshStandardMaterial({ color: 0x2b1a12, roughness: 0.8 }), 1.6, 0.1, 0.4, 'roof');
  const winM = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.6, 1.55, 0.7) });
  const glows = [];
  [[-44, -62, 0.5], [55, -88, -0.4], [-78, -118, 0.2], [30, -150, 0.8]].forEach(([x, z, ry]) => {
    const house = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(7, 4, 5.5), wood); body.position.y = 2; house.add(body);
    const roofShape = new THREE.Shape(); roofShape.moveTo(-4.3, 0); roofShape.lineTo(0, 3.2); roofShape.lineTo(4.3, 0); roofShape.closePath();
    const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape, { depth: 6.4, bevelEnabled: false }), roofM);
    roof.position.set(0, 4, -3.2); house.add(roof);
    for (const wx of [-1.8, 1.8]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.5), winM); w.position.set(wx, 2.2, 2.76); house.add(w); }
    const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.2, 0.8), wood); chimney.position.set(2, 6, -1); house.add(chimney);
    house.position.set(x, FLOOR_Y, z); house.rotation.y = ry;
    house.traverse(o => { if (o.isMesh && o.material !== winM) { o.castShadow = false; o.receiveShadow = true; } });
    group.add(house);
    const wp = new THREE.Vector3(0, 2.2, 3.4).applyEuler(new THREE.Euler(0, ry, 0)).add(house.position);
    glows.push(wp);
  });
  // 远处零星的窗光
  const n = 46, pos = new Float32Array((n + glows.length) * 3), seed = new Float32Array(n + glows.length);
  for (let i = 0; i < n; i++) {
    let x, z;
    do { const a = rnd() * Math.PI * 2, r = R(90, 200); x = Math.sin(a) * r; z = Math.cos(a) * r; } while (z > -25);
    pos.set([x, FLOOR_Y + R(0.6, 3.2), z], i * 3); seed[i] = rnd() * 100;
  }
  glows.forEach((w, i) => { pos.set([w.x, w.y, w.z], (n + i) * 3); seed[n + i] = 7.7; });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aS', new THREE.BufferAttribute(seed, 1));
  const pm = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.uTime, uPR: U.uPR },
    vertexShader: `uniform float uTime, uPR; attribute float aS; varying float vI;
      void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vI = 0.8 + 0.2 * sin(uTime * (0.5 + fract(aS)) + aS);
        gl_PointSize = (aS == 7.7 ? 14.0 : 3.0 + 2.5 * fract(aS * 7.1)) * uPR * (aS == 7.7 ? 60.0 / -mv.z : 1.0); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vI; void main(){ float d = length(gl_PointCoord - 0.5) * 2.0; float a = exp(-d * d * 5.0) * vI; gl_FragColor = vec4(vec3(1.0, 0.68, 0.32) * a * 1.3, 1.0); }`
  });
  const pts = new THREE.Points(g, pm); pts.frustumCulled = false;
  group.add(pts);
  return group;
}

// 切换背景：画面先淡出，换好再淡入
function applyTheme(t, fade) {
  const swap = () => {
    theme = t;
    const look = THEME_LOOK[t];
    if (cityGroup) cityGroup.visible = t === 'city';
    if (forestGroup) forestGroup.visible = t === 'forest';
    if (bokehPts) bokehPts.visible = t !== 'city';
    skyMat.uniforms.uTheme.value = THEMES.indexOf(t);
    skyMat.uniforms.uHor.value.set(...look.hor);
    scene.fog.color.setRGB(...look.hor);
    scene.fog.density = look.fog;
    U.uRoad.value = t === 'city' ? 1 : 0;
    updateLiveReflections(true);
    document.querySelectorAll('#bg-seg button').forEach((b, i) => { const on = b.dataset.bg === t; b.setAttribute('aria-checked', on); if (on) $('#bg-seg').style.setProperty('--i', i); });
    try { localStorage.setItem('noel-theme', t); } catch (e) {}
  };
  if (!fade || reducedMotion) return swap();
  const host = $('#scene');
  host.classList.add('switching');
  setTimeout(() => { swap(); requestAnimationFrame(() => host.classList.remove('switching')); }, 380);
}
function setTheme(t) { if (t !== theme && renderer) { applyTheme(t, true); toast('✦ ' + THEME_TEXT[t]); } }
document.querySelectorAll('#bg-seg button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.bg)));

function buildStars() {
  const n = 1600, pos = new Float32Array(n * 3), seed = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) {
    const u = R(0.02, 1), a = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 480;
    pos.set([Math.cos(a) * s * r, u * r, Math.sin(a) * s * r], i * 3);
    seed.set([rnd() * 100, Math.pow(rnd(), 3) * 2.2 + 0.7], i * 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 2));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.uTime, uPR: U.uPR },
    vertexShader: `uniform float uTime; uniform float uPR; attribute vec2 aSeed; varying float vA;
      void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0);
        vA = (0.55 + 0.45 * sin(uTime * (0.6 + fract(aSeed.x) * 2.5) + aSeed.x)) * smoothstep(0.1, 0.3, normalize(position).y);
        gl_PointSize = aSeed.y * uPR; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - 0.5) * 2.0; float a = smoothstep(1.0, 0.0, d) * vA; gl_FragColor = vec4(vec3(1.0, 0.95, 0.86) * a * 0.9, 1.0); }`
  });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; pts.renderOrder = -9;
  noReflect.push(pts);
  scene.add(pts);
}

// ---------------- 背景失焦光斑 ----------------
function buildBokeh() {
  const n = 55, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), seed = new Float32Array(n * 2);
  const hues = [[1.0, 0.72, 0.36], [1.0, 0.82, 0.55], [0.95, 0.35, 0.36], [0.35, 0.75, 0.62], [0.9, 0.9, 1.0]];
  for (let i = 0; i < n; i++) {
    pos.set([R(-200, 200), R(0, 90), R(-230, -120)], i * 3);
    const h = pick(hues), k = R(0.05, 0.14);
    col.set([h[0] * k, h[1] * k, h[2] * k], i * 3);
    seed.set([rnd() * 100, R(3, 8)], i * 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 2));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.uTime, uPointScale: U.uPointScale },
    vertexShader: `uniform float uTime; uniform float uPointScale; attribute vec3 aColor; attribute vec2 aSeed; varying vec3 vC;
      void main(){ vec3 p = position; p.x += sin(uTime * 0.05 + aSeed.x) * 4.0; p.y += cos(uTime * 0.04 + aSeed.x * 1.3) * 2.0;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vC = aColor * (0.75 + 0.25 * sin(uTime * 0.3 + aSeed.x));
        gl_PointSize = min(aSeed.y * uPointScale / -mv.z, 260.0); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying vec3 vC; void main(){ float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;
        float body = smoothstep(1.0, 0.86, d); float rim = smoothstep(0.55, 0.95, d) * body;
        gl_FragColor = vec4(vC * (body * 0.45 + rim * 0.6), 1.0); }`
  });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; pts.renderOrder = -8;
  bokehPts = pts;
  noReflect.push(pts);
  scene.add(pts);
}

function buildLights() {

// ---------------- 积雪覆盖：朝上的面随积雪变白、变哑光 ----------------
function injectSnowCap(shader, k = 1, lo = 0.55, hi = 0.85) {

// ---------------- 积雪地面：越积越厚；雪粒按反射定律朝光源闪光；没盖住的地方露出冰面倒影 ----------------
const SNOW_GLSL = `

float sHash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float sNoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(sHash(i), sHash(i + vec2(1.0, 0.0)), u.x), mix(sHash(i + vec2(0.0, 1.0)), sHash(i + vec2(1.0, 1.0)), u.x), u.y); }

  float road = smoothstep(21.0, 23.0, abs(p.x)) * (1.0 - smoothstep(41.0, 43.0, abs(p.x)));
  n -= road * 0.9 * uRoad;
  float edge = uSnowCover + 0.22 * smoothstep(12.0, 70.0, r);
  return smoothstep(1.2 - edge * 1.3, 1.32 - edge * 1.3, n);
}
float snowH(vec2 p){

  float shelter = mix(0.3, 1.0, smoothstep(5.0, 12.0, r));   // 树冠下面积得少
  return uSnowDepth * coverAt(p) * drift * shelter;
}`;
function buildSnowGround() {

    color: 0x9aa6bd, roughness: 0.62, metalness: 0, sheen: 0.5, sheenColor: new THREE.Color('#9fb6e6'), sheenRoughness: 0.8,

        float sh0 = snowH(swp);

        float sdx = snowH(swp + vec2(se, 0.0)) - snowH(swp - vec2(se, 0.0));

      .replace('#include <project_vertex>', '#include <project_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        ${SNOW_GLSL}
        uniform vec3 uStarPos; uniform vec3 uMoonLightDir;
        varying vec3 vWPos; varying float vSnowAmt;
        float gHash(vec2 p){ return fract(sin(dot(p, vec2(269.5, 183.3))) * 43758.5453); }
        float gNoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(gHash(i), gHash(i + vec2(1.0, 0.0)), u.x), mix(gHash(i + vec2(0.0, 1.0)), gHash(i + vec2(1.0, 1.0)), u.x), u.y); }`)

}

function pointsGeometry(n, fill) {
  const tree = new Float32Array(n * 3), sc = new Float32Array(n * 3), seed = new Float32Array(n * 4), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) fill(i, tree, sc, seed, col);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(tree, 3));
  g.setAttribute('aScatter', new THREE.BufferAttribute(sc, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  return g;
}
const POINT_HEAD = `${MORPH_GLSL}
uniform float uPointScale; uniform float uAudio;
attribute vec3 aScatter; attribute vec4 aSeed; attribute vec3 aColor;`;

// 针叶：不透明小圆片，带主光和轮廓光，形成有体积的深翡翠树冠
function buildFoliage(n) {
  const greens = ['#0a4a2e', '#0e5a38', '#126a42', '#1a7a4c', '#23895a', '#093d27', '#0f6444'].map(c => new THREE.Color(c));
  const frost = new THREE.Color('#a6dcc0'), gold = new THREE.Color('#d8b25a');
  const c = new THREE.Color();
  const g = pointsGeometry(n, (i, tree, sc, seed, col) => {
    const t = sampleT(0, 0.985), depth = Math.pow(rnd(), 0.28);
    tree.set(surf(t, depth * 1.0), i * 3);
    sc.set(scatterPoint(), i * 3);
    seed.set([rnd() * 6.283, delayOf(t), R(0.2, 0.42) * (1 + (1 - t) * 0.25), R(-1, 1)], i * 4);
    c.copy(pick(greens));
    const r = rnd();
    if (depth > 0.95 && r < 0.09) c.lerp(frost, 0.55);
    else if (depth > 0.9 && r < 0.13) c.lerp(gold, 0.5);
    c.multiplyScalar(0.5 + 0.5 * depth);
    col.set([c.r, c.g, c.b], i * 3);

  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uMorph: U.uMorph, uPointScale: U.uPointScale, uAudio: U.uAudio, uSnowCap: U.uSnowCap },
    vertexShader: `${POINT_HEAD}
      uniform float uSnowCap;
      varying vec3 vCol;
      void main(){
        float p = morphP(aSeed.y);
        vec3 pos = morphPos(position, aScatter, p, aSeed);
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        vec3 n = normalize(vec3(position.x, 0.45 * length(position.xz) + 0.3, position.z) + vec3(0.0, 0.001, 0.0));
        vec3 nv = normalize(normalMatrix * n);
        vec3 vd = normalize(-mv.xyz);
        vec3 L = normalize((viewMatrix * vec4(-0.45, 0.55, 0.7, 0.0)).xyz);
        float diff = max(dot(nv, L), 0.0);
        float rim = pow(1.0 - max(dot(nv, vd), 0.0), 2.5);
        vCol = aColor * (0.3 + 1.1 * diff) + vec3(0.95, 0.72, 0.42) * rim * 0.22 * (1.0 - p) + aColor * 0.6 * p;
        // 积雪越厚，越多枝梢挂上白霜
        float frost = step(fract(aSeed.x * 7.13), uSnowCap * 0.22) * (1.0 - p) * smoothstep(0.2, 0.6, n.y);
        vCol = mix(vCol, vec3(0.62, 0.68, 0.8) * (0.35 + 0.8 * diff), frost);
        gl_PointSize = clamp(aSeed.z * uPointScale / -mv.z * mix(1.0, 0.7, p), 1.5, mix(28.0, 14.0, p));
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `varying vec3 vCol;
      void main(){ vec2 c = gl_PointCoord - 0.5; float d = dot(c, c); if (d > 0.25) discard; gl_FragColor = vec4(vCol * (1.08 - d * 1.7), 1.0); }`
  });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false;
  foliagePts = pts;
  mainGroup.add(pts);
}

function patchMorph(material) {
  material.onBeforeCompile = shader => {
    shader.uniforms.uTime = U.uTime; shader.uniforms.uMorph = U.uMorph;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${MORPH_GLSL}\nattribute vec3 aTree; attribute vec3 aScatter; attribute vec4 aSeed;`)
      .replace('#include <beginnormal_vertex>', `
        float mp = morphP(aSeed.y);
        mat3 RT = rotY(aSeed.x + uTime * aSeed.w * mix(0.2, 1.4, mp)) * rotX(aSeed.x * 1.7 + mp * uTime * aSeed.w * 0.8);
        vec3 objectNormal = RT * vec3(normal);
        #ifdef USE_TANGENT
          vec3 objectTangent = vec3(tangent.xyz);
        #endif`)
      .replace('#include <begin_vertex>', `vec3 transformed = RT * (position * aSeed.z) + morphPos(aTree, aScatter, mp, aSeed);`);
    injectSnowCap(shader, 0.3, 0.75, 0.95);
  };
  material.customProgramCacheKey = () => 'noel-morph-snow';
  return material;
}

    sc.set(scatterPoint(), i * 3);
    seed.set([rnd() * 6.283, delayOf(t), R(size[0], size[1]) * (0.72 + 0.5 * (1 - t)), R(-1, 1)], i * 4);
    if (colors) { c.set(pick(colors)); mesh.setColorAt(i, c); }

const GLOW_FRAG = `varying vec3 vCol; varying float vI;

function buildTreeLights(n) {

  const accents = [[1.0, 0.3, 0.3], [0.6, 0.8, 1.0]];
  const g = pointsGeometry(n, (i, tree, sc, seed, col) => {
    const t = sampleT(0.02, 0.96);
    tree.set(surf(t, R(1.0, 1.06)), i * 3);
    sc.set(scatterPoint(), i * 3);
    seed.set([rnd() * 6.283, delayOf(t), R(0.3, 0.52), rnd()], i * 4);
    const h = rnd() < 0.12 ? pick(accents) : pick(warm), k = R(1.6, 2.6);
    col.set([h[0] * k, h[1] * k, h[2] * k], i * 3);

    float p = morphP(aSeed.y);

function buildGarland(n) {
  const turns = 6.5;

    const u = i / n, t = 0.04 + u * 0.9, a = u * turns * Math.PI * 2;
    const r = envR(t) * 1.03 + 0.25;
    tree.set([Math.cos(a) * r + R(-0.08, 0.08), TREE.base + t * TREE.H + R(-0.08, 0.08), Math.sin(a) * r + R(-0.08, 0.08)], i * 3);
    sc.set(scatterPoint(), i * 3);

    float p = morphP(aSeed.y);

    vCol = aColor;
    gl_PointSize = aSeed.z * uPointScale / -mv.z;
    gl_Position = projectionMatrix * mv;`);

}

function buildGlints(n) {

    uniforms: { uTime: U.uTime, uMorph: U.uMorph, uPointScale: U.uPointScale, uAudio: U.uAudio, uH: { value: TREE.H }, uBase: { value: TREE.base }, uR: { value: TREE.R } },
    vertexShader: `uniform float uTime, uMorph, uPointScale, uAudio, uH, uBase, uR; attribute vec4 aSeed; varying float vA;
      void main(){

function radialTexture(stops, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'), g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function raysTexture(size = 512) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.translate(size / 2, size / 2);
  const ray = (len, w, alpha) => {
    const g = x.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, `rgba(255,244,210,${alpha})`); g.addColorStop(1, 'rgba(255,220,150,0)');
    x.fillStyle = g; x.beginPath(); x.moveTo(0, -w); x.lineTo(len, 0); x.lineTo(0, w); x.closePath(); x.fill();
  };
  for (let i = 0; i < 4; i++) { x.save(); x.rotate(i * Math.PI / 2); ray(size * 0.5, size * 0.018, 0.95); x.restore(); }
  for (let i = 0; i < 4; i++) { x.save(); x.rotate(i * Math.PI / 2 + Math.PI / 4); ray(size * 0.3, size * 0.012, 0.6); x.restore(); }
  for (let i = 0; i < 16; i++) { x.save(); x.rotate(i * Math.PI / 8 + 0.2); ray(size * (0.14 + Math.random() * 0.12), size * 0.006, 0.35); x.restore(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

        vec2 g = vP * 5.0; vec2 id = floor(g); float h = hash(id);
        float tw = pow(max(0.0, sin(uTime * (0.6 + h * 2.5) + h * 40.0)), 28.0);
        float sp = step(0.982, h) * smoothstep(0.32, 0.0, length(fract(g) - 0.5)) * tw * smoothstep(46.0, 6.0, r);
        col += vec3(1.0, 0.86, 0.62) * sp * 3.5;
        col += vec3(0.30, 0.16, 0.06) * exp(-r * r / 70.0) * (0.85 + uAudio * 0.8);
        // 车道线：两条白色虚线 + 路缘实线
        float dash = step(0.45, fract(vP.y * 0.08));
        float ln = (1.0 - smoothstep(0.08, 0.16, abs(ax - 28.0))) * dash + (1.0 - smoothstep(0.08, 0.16, abs(ax - 36.0))) * dash
                 + (1.0 - smoothstep(0.1, 0.2, abs(ax - 22.6))) + (1.0 - smoothstep(0.1, 0.2, abs(ax - 41.4)));
        col += vec3(0.5, 0.5, 0.46) * ln * road * 0.1 * (1.0 - smoothstep(150.0, 300.0, r));
        col = mix(col, vec3(0.02, 0.024, 0.038), smoothstep(40.0, 400.0, r));
        gl_FragColor = vec4(col, 1.0 - refl);
      }`
  });
  const top = new THREE.Mesh(new THREE.CircleGeometry(420, 64), floorMat);
  top.rotation.x = -Math.PI / 2; top.position.y = FLOOR_Y + 0.02; top.renderOrder = 1;
  scene.add(top);
}

// ---------------- 雪：细雪 + 六角雪花，全部在 GPU 上飘 ----------------
function buildSnow(n) {
  const pos = new Float32Array(n * 3), seed = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) {
    const flake = rnd() < 0.2;
    pos.set([R(-80, 80), R(0, 72), R(-90, 58)], i * 3);
    seed.set([rnd() * 6.283, flake ? R(0.9, 1.8) : R(1.2, 3.2), flake ? 1 : 0, flake ? R(0.34, 0.6) : R(0.1, 0.26)], i * 4);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: U.uTime, uPointScale: U.uPointScale, uFloor: { value: FLOOR_Y } },
    vertexShader: `uniform float uTime, uPointScale, uFloor; attribute vec4 aSeed; varying float vA; varying float vFlake; varying float vRot;
      void main(){
        vec3 p = position;
        p.y = mod(p.y - uTime * aSeed.y, 72.0) + uFloor - 2.0;
        p.x += sin(uTime * 0.35 + aSeed.x) * 1.4 + sin(uTime * 0.9 + aSeed.x * 3.0) * 0.3;
        p.z += cos(uTime * 0.3 + aSeed.x * 1.3) * 1.4;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float dist = -mv.z;
        vFlake = aSeed.z;
        vRot = aSeed.x + uTime * (0.4 + fract(aSeed.x * 3.1)) * (fract(aSeed.x) > 0.5 ? 1.0 : -1.0);
        vA = smoothstep(3.0, 14.0, dist) * (1.0 - smoothstep(95.0, 150.0, dist)) * smoothstep(uFloor, uFloor + 3.0, p.y) * 0.9;
        gl_PointSize = min(aSeed.w * uPointScale / dist, 72.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `varying float vA; varying float vFlake; varying float vRot;
      void main(){
        vec2 c = (gl_PointCoord - 0.5) * 2.0; float r = length(c), a;
        if (vFlake > 0.5) {
          // 六重对称的星形枝晶：六根主枝，每根上两对 60° 斜出的短枝
          float cs = cos(vRot), sn = sin(vRot); c = mat2(cs, -sn, sn, cs) * c;
          float ang = atan(c.y, c.x);
          float k = abs(mod(ang + 0.5236, 1.0472) - 0.5236);
          float along = cos(k) * r, perp = sin(k) * r;
          float arm = smoothstep(0.075, 0.015, perp) * smoothstep(0.95, 0.8, r);
          float twig = 0.0;
          for (int i = 0; i < 2; i++) {
            float rb = 0.34 + 0.26 * float(i);
            float onTwig = smoothstep(0.06, 0.012, abs(perp - (along - rb) * 1.732) * 0.5);
            twig = max(twig, onTwig * step(rb, along) * step(along, rb + 0.2 - 0.06 * float(i)));
          }
          a = max(arm, twig * 0.9) + exp(-r * r * 30.0) * 0.8;
        } else a = smoothstep(1.0, 0.15, r);
        a *= vA;
        if (a < 0.01) discard;
        gl_FragColor = vec4(vec3(0.88, 0.92, 1.0) * 0.95, min(a, 1.0));
      }`
  });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; pts.renderOrder = 5;
  noReflect.push(pts);
  scene.add(pts);
}

// 景深（按深度的散景模糊）：取场景的深度图算每个像素离焦点多远，按黄金角螺旋采样模糊；
// 前景清楚的东西（树的轮廓）不会糊到背后的虚化里，亮的大屏会化成圆形光斑
class DofPass extends Pass {
  constructor() {
    super();
    this.material = new THREE.ShaderMaterial({
      uniforms: { tColor: { value: null }, tDepth: { value: null }, uNear: { value: 0.5 }, uFar: { value: 1200 }, uFocus: { value: 58 }, uK: { value: 13 }, uMaxR: { value: 12 }, uRes: { value: new THREE.Vector2(1, 1) } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform sampler2D tColor, tDepth; uniform float uNear, uFar, uFocus, uK, uMaxR; uniform vec2 uRes; varying vec2 vUv;
        float viewZ(vec2 uv){ float d = textureLod(tDepth, uv, 0.0).x; return (uNear * uFar) / (uFar - d * (uFar - uNear)); }
        float coc(float z){ return clamp(abs(z - uFocus) / z * uK, 0.0, uMaxR); }
        void main(){
          vec3 c = texture2D(tColor, vUv).rgb;
          float z0 = viewZ(vUv), c0 = coc(z0);
          if (c0 < 0.6) { gl_FragColor = vec4(c, 1.0); return; }
          vec3 acc = c; float ws = 1.0;
          for (int i = 1; i < 40; i++) {
            float fi = float(i), r = sqrt(fi / 40.0) * c0, a = fi * 2.39996323;
            vec2 uv = vUv + vec2(cos(a), sin(a)) * r / uRes;
            float zs = viewZ(uv), cs = coc(zs);
            float w = zs > z0 - 0.5 ? 1.0 : smoothstep(r - 1.0, r + 1.0, cs);
            vec3 s = textureLod(tColor, uv, 0.0).rgb;
            w *= 1.0 + min(dot(s, vec3(0.2126, 0.7152, 0.0722)), 4.0) * 0.5;
            acc += s * w; ws += w;
          }
          gl_FragColor = vec4(acc / ws, 1.0);
        }`
    });
    this.fsQuad = new FullScreenQuad(this.material);
  }
  render(renderer, writeBuffer, readBuffer) {
    const u = this.material.uniforms;
    u.tColor.value = readBuffer.texture; u.tDepth.value = readBuffer.depthTexture;
    u.uRes.value.set(readBuffer.width, readBuffer.height);
    u.uNear.value = camera.near; u.uFar.value = camera.far;
    // 散景大小按渲染宽度换算：2560 宽时最大 12 像素
    u.uMaxR.value = 12 * readBuffer.width / 2560; u.uK.value = 13 * readBuffer.width / 2560;
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.fsQuad.render(renderer);
  }
}

// ---------------- 后期：体积光 → 泛光 → 色调映射 → 暗角/颗粒/色散 ----------------
function buildPost() {
  const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
  rt.depthTexture = new THREE.DepthTexture(innerWidth, innerHeight);
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  dofPass = new DofPass();
  composer.addPass(dofPass);
  raysPass = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uLight: { value: new THREE.Vector2(0.5, 0.8) }, uStrength: { value: 0.0 }, uAspect: { value: 1 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform vec2 uLight; uniform float uStrength, uAspect; varying vec2 vUv;
      // 每个像素的起点随机错开（交错梯度噪声），步进留下的一格格残影就化成了平滑的光束
      float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
      void main(){
        vec4 base = texture2D(tDiffuse, vUv);
        const int N = 44;
        vec2 delta = (vUv - uLight) / float(N) * 0.9;
        vec2 uv = vUv - delta * ign(gl_FragCoord.xy);
        float decay = 1.0; vec3 acc = vec3(0.0);
        for (int i = 0; i < N; i++) {
          uv -= delta;
          vec3 s = texture2D(tDiffuse, uv).rgb;
          float l = dot(s, vec3(0.2126, 0.7152, 0.0722));
          acc += min(s, vec3(8.0)) * smoothstep(3.5, 9.0, l) * decay;
          decay *= 0.955;
        }
        vec2 d = (vUv - uLight) * vec2(uAspect, 1.0);
        float fall = exp(-dot(d, d) * 2.2);
        gl_FragColor = vec4(base.rgb + acc * (uStrength / float(N)) * (0.35 + fall), base.a);
      }`
  });
  composer.addPass(raysPass);
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.42, 0.95);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  // 最后一步：低分辨率渲染时在这里放大到屏幕分辨率（Catmull-Rom 双三次）并做对比度自适应锐化（CAS），
  // 再叠暗角、胶片颗粒、轻微色散
  finalPass = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: U.uTime, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uSrcRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uSharp: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float uTime, uSharp; uniform vec2 uRes, uSrcRes; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      vec3 tex(vec2 uv){ return texture2D(tDiffuse, uv).rgb; }
      vec3 bicubic(vec2 uv){
        vec2 sp = uv * uSrcRes, tc = floor(sp - 0.5) + 0.5, f = sp - tc;
        vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f)), w1 = 1.0 + f * f * (-2.5 + 1.5 * f), w2 = f * (0.5 + f * (2.0 - 1.5 * f)), w3 = f * f * (-0.5 + 0.5 * f);
        vec2 w12 = w1 + w2, t0 = (tc - 1.0) / uSrcRes, t3 = (tc + 2.0) / uSrcRes, t12 = (tc + w2 / w12) / uSrcRes;
        vec3 r = tex(vec2(t0.x, t0.y)) * w0.x * w0.y + tex(vec2(t12.x, t0.y)) * w12.x * w0.y + tex(vec2(t3.x, t0.y)) * w3.x * w0.y
               + tex(vec2(t0.x, t12.y)) * w0.x * w12.y + tex(vec2(t12.x, t12.y)) * w12.x * w12.y + tex(vec2(t3.x, t12.y)) * w3.x * w12.y
               + tex(vec2(t0.x, t3.y)) * w0.x * w3.y + tex(vec2(t12.x, t3.y)) * w12.x * w3.y + tex(vec2(t3.x, t3.y)) * w3.x * w3.y;
        return max(r, 0.0);
      }
      vec3 cas(vec2 uv, vec3 c){
        vec2 px = 1.0 / uSrcRes;
        vec3 a = tex(uv - vec2(0.0, px.y)), b = tex(uv - vec2(px.x, 0.0)), d = tex(uv + vec2(px.x, 0.0)), e = tex(uv + vec2(0.0, px.y));
        vec3 mn = min(c, min(min(a, b), min(d, e))), mx = max(c, max(max(a, b), max(d, e)));
        vec3 amp = sqrt(clamp(min(mn, 1.0 - mx) / max(mx, vec3(1e-4)), 0.0, 1.0));
        vec3 w = -amp * 0.2;
        return clamp((c + (a + b + d + e) * w) / (1.0 + 4.0 * w), 0.0, 1.0);
      }
      void main(){
        vec2 c = vUv - 0.5;
        float k = dot(c, c);
        vec2 off = c * k * 0.012;
        vec3 col;
        if (uSharp > 0.5) {
          col = cas(vUv, bicubic(vUv));
          col.r = mix(col.r, tex(vUv + off).r, 0.7); col.b = mix(col.b, tex(vUv - off).b, 0.7);
        } else col = vec3(tex(vUv + off).r, tex(vUv).g, tex(vUv - off).b);
        float vig = smoothstep(0.95, 0.18, length(c * vec2(1.0, 1.12)));
        col *= mix(0.42, 1.0, vig);
        col += (hash(vUv * uRes + fract(uTime) * 100.0) - 0.5) * 0.022;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  composer.addPass(finalPass);
}

// ---------------- 画质与尺寸 ----------------
function applyQuality() {
  const L = LEVELS[quality];
  for (const rt of [composer.renderTarget1, composer.renderTarget2]) if (rt.samples !== L.samples) { rt.samples = L.samples; rt.dispose(); }
  raysPass.enabled = L.rays;
  dofPass.enabled = L.dof && !qs.has('nodof');
  mirror.visible = L.reflect > 0;
  floorMat.uniforms.uRefl.value = L.reflect > 0 ? 1 : 0;
  moonLight.castShadow = L.shadow;
  window.__stats.quality = quality;
  onResize();
}
function pixelRatioFor(L) {
  const css = innerWidth * innerHeight / 1e6;
  return Math.max(0.6, Math.min(window.devicePixelRatio || 1, Math.sqrt(L.budget * GPU.budgetScale / css)));
}
const renderScale = L => Math.min(L.scale, fsrUser ? 0.67 : 1);
function syncFsrUI() { $('#row-fsr').setAttribute('aria-checked', String(fsrUser)); }
$('#row-fsr').addEventListener('click', () => {
  fsrUser = !fsrUser;
  try { localStorage.setItem('noel-fsr', fsrUser ? '1' : '0'); } catch (e) {}
  syncFsrUI();
  if (renderer) onResize();
  toast(fsrUser ? '超分辨率已开：67% 分辨率渲染，放大并锐化' : '超分辨率已关：原生分辨率渲染', 2400);
});
// ---------------- 显卡：确认是不是在独显上跑 ----------------
const GPU = { name: '', discrete: false, budgetScale: 1 };
function detectGPU(gl) {
  try {
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    GPU.name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  } catch (e) { GPU.name = ''; }
  GPU.discrete = /NVIDIA|GeForce|RTX|GTX|Radeon RX|Radeon Pro|Arc\(TM\) A/i.test(GPU.name);
  const integrated = /Intel|UHD|Iris|Radeon\(TM\) Graphics|Vega|SwiftShader|llvmpipe|Basic Render/i.test(GPU.name) && !GPU.discrete;
  // 独显：原生分辨率 + 全部特效；核显：保持省电的像素预算
  GPU.budgetScale = GPU.discrete ? 2.2 : 1;
  window.__stats.gpu = GPU.name;
  console.info('[显卡]', GPU.name || '未知', GPU.discrete ? '（独显）' : integrated ? '（核显）' : '');
  if (integrated) setTimeout(() => toast(window.__NOEL_DESKTOP__
    ? '当前在核显上渲染：请在 Windows 设置 → 显示 → 图形 里把 Noel 设为「高性能」后重开'
    : '当前在核显上渲染：请关掉所有浏览器窗口后，双击「启动圣诞树.bat」用独显打开', 7000), 4000);
}
function fitDistance() {
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), a = innerWidth / innerHeight;
  return Math.max(25.5 / t, 14 / (t * a));
}
let baseDist = 50;
function onResize() {
  const w = innerWidth, h = innerHeight, L = LEVELS[quality];
  const outPr = pixelRatioFor(L), scale = renderScale(L), inPr = outPr * scale;
  // 画布按输出分辨率，场景和后期按渲染分辨率；两者不同时由最后一步放大锐化
  renderer.setPixelRatio(outPr); renderer.setSize(w, h);
  composer.setPixelRatio(inPr); composer.setSize(w, h);
  U.uPR.value = inPr;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const rs = (L.reflect || 0.33) * (GPU.discrete ? 1.5 : 1);
  mirror.getRenderTarget().setSize(Math.round(w * inPr * rs), Math.round(h * inPr * rs));
  U.uPointScale.value = h * inPr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  finalPass.uniforms.uRes.value.set(w * outPr, h * outPr);
  finalPass.uniforms.uSrcRes.value.set(Math.round(w * inPr), Math.round(h * inPr));
  finalPass.uniforms.uSharp.value = scale < 0.99 ? 1 : 0;
  raysPass.uniforms.uAspect.value = w / h;
  baseDist = fitDistance();
  window.__stats.render = `${Math.round(w * inPr)}×${Math.round(h * inPr)}`;
}
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

// ---------------- 模式 ----------------
const MODE_TEXT = { TREE: '聚合成树', SCATTER: '散作星河', HOLDING: '取出一张照片' };
function setMode(m, { photo = -1, silent = false } = {}) {
  if (m === 'HOLDING') {
    let idx = photo;
    if (idx < 0) { do { idx = Math.floor(Math.random() * photos.length); } while (photos.length > 1 && idx === lastHeld); }
    heldPhoto = photos[idx]; lastHeld = idx;
  } else heldPhoto = null;
  const changed = m !== mode;
  mode = m;
  const btns = [...document.querySelectorAll('#seg button')];
  btns.forEach((b, i) => { const on = b.dataset.mode === m; b.setAttribute('aria-checked', on); if (on) $('#seg').style.setProperty('--i', i); });
  if (!silent && changed) toast('✦ ' + MODE_TEXT[m]);
}
window.setMode = m => setMode(m);

// ---------------- 主循环 ----------------
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), camDir = new THREE.Vector3();
const scatterQ = new THREE.Quaternion();
let last = performance.now(), fpsAcc = 0, fpsFrames = 0, slowWindows = 0;
// 高刷屏（你的是 240Hz）上不追 240 帧：按屏幕刷新间隔整数倍跳帧，稳定出 60 帧，节奏均匀不抖
let TARGET_MS = 1000 / Math.max(30, +(qs.get('hz') || 60));
let rafLast = 0, rafInterval = 16.7, rafSkip = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) { last = now; rafLast = now; return; }
  const gap = now - rafLast; rafLast = now;
  if (gap > 2 && gap < 40) rafInterval += (gap - rafInterval) * 0.05;
  const step = Math.max(1, Math.round(TARGET_MS / rafInterval));
  if (++rafSkip < step) return;
  rafSkip = 0;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  time += dt; U.uTime.value = time;

  // 形变：线性推进，每粒自带错峰与缓动
  const target = mode === 'SCATTER' ? 1 : 0;
  const speed = reducedMotion ? 1.2 : 0.42;
  morph += Math.sign(target - morph) * Math.min(Math.abs(target - morph), dt * speed);
  U.uMorph.value = morph;
  const mE = morph * morph * (3 - 2 * morph);

  // 旋转：自转 + 拖动惯性 + 手势偏移
  yawVel *= Math.exp(-dt * 2.2);
  yaw += dt * (mode === 'SCATTER' ? 0.05 : 0.14) + yawVel * dt;
  handYaw += (handYawTarget - handYaw) * (1 - Math.exp(-dt * 3));
  mainGroup.rotation.y = yaw + handYaw;
  pedestal.rotation.y = mainGroup.rotation.y;

  // 相机：开场从远处推近 + 指针视差 + 呼吸
  pointer.sx += (pointer.x - pointer.sx) * (1 - Math.exp(-dt * 2.5));
  pointer.sy += (pointer.y - pointer.sy) * (1 - Math.exp(-dt * 2.5));
  const intro = revealed ? Math.min(1, (time - revealAt) / 3.4) : 0;
  const introE = 1 - Math.pow(1 - intro, 3);
  const dist = baseDist * (1.38 - 0.38 * introE) * (1 + mE * 0.12);
  const lift = 18 * (1 - introE);
  camera.position.set(pointer.sx * 4.5 + Math.sin(time * 0.13) * 0.8, 4.4 + lift - pointer.sy * 2.5 + Math.sin(time * 0.17) * 0.4, dist);
  camera.lookAt(0, 4.6 + lift * 0.35, 0);
  camera.getWorldDirection(camDir);

  // 树顶星
  const audio = U.uAudio.value;
  starGroup.position.y = TREE.base + TREE.H + 1.35 + mE * 7;
  starGroup.children[0].rotation.y = time * 0.6;
  starGroup.children[0].rotation.x = Math.sin(time * 0.5) * 0.1;
  const pulse = 1 + Math.sin(time * 2.2) * 0.06 + audio * 0.35;
  starHalo.scale.setScalar(7 * pulse);
  starRays.scale.setScalar(15 * (1 + Math.sin(time * 1.3) * 0.08 + audio * 0.25));
  starRays.material.rotation = time * 0.08;
  starLight.intensity = 90 * (1 + audio * 0.8);
  trunk.scale.setScalar(Math.max(0.001, 1 - mE));
  treeProxy.scale.setScalar(Math.max(0.001, 1 - mE));
  starGroup.getWorldPosition(U.uStarPos.value);
  if (theme === 'city') updateCars(dt);
  if (ball) { ball.rotation.y = time * 0.3; ball.material.emissive.setHSL((time * 0.05) % 1, 0.7, 0.55); }
  updateLiveReflections(false);
  dofPass.material.uniforms.uFocus.value = camera.position.distanceTo(tmpV.set(0, 2, 0));

  // 积雪：慢慢变厚；清扫时几秒内化掉
  if (sweeping) { snowAmt = Math.max(0, snowAmt - dt * 0.45); if (snowAmt === 0) sweeping = false; }
  else snowAmt = Math.min(1, snowAmt + dt / SNOW_FULL_S);
  U.uSnowDepth.value = 1.45 * Math.pow(snowAmt, 1.1);
  U.uSnowCover.value = 0.18 + 0.66 * snowAmt;
  U.uSnowCap.value = Math.min(1, snowAmt * 1.2);
  if ((snowMetaTimer += dt) > 1) {
    snowMetaTimer = 0;
    $('#snow-meta').textContent = sweeping ? '正在清扫…' : `${(U.uSnowDepth.value * 10).toFixed(0)} cm · 点击清扫`;
  }
  // 照片多于相框时，每 6 秒换一张上树
  if ((rotTimer += dt) > 6) { rotTimer = 0; if (library.length > photos.length && mode !== 'SCATTER' && !heldPhoto) rotateOne(); }

  // 相框
  const kPos = 1 - Math.exp(-dt * 5), kRot = 1 - Math.exp(-dt * 6);
  for (const ph of photos) {
    const g = ph.group;
    if (ph === heldPhoto) {
      if (g.parent !== scene) scene.attach(g);
      tmpV.copy(camera.position).addScaledVector(camDir, 17);
      tmpV.y += -2.2 + Math.sin(time * 1.2) * 0.15;
      g.position.lerp(tmpV, kPos);
      tmpQ.copy(camera.quaternion);
      g.quaternion.slerp(tmpQ, kRot);
      const s = g.scale.x + (1.45 - g.scale.x) * kPos;
      g.scale.setScalar(s);
    } else {
      if (g.parent !== mainGroup) mainGroup.attach(g);
      let p = Math.min(1, Math.max(0, morph * 1.6 - ph.delay * 0.6)); p = p * p * (3 - 2 * p);
      tmpV.copy(ph.base).lerp(tmpV2.copy(ph.scatter).applyAxisAngle(THREE.Object3D.DEFAULT_UP, time * 0.03), p);
      tmpV.y += Math.sin(time * 1.1 + ph.phase) * 0.08;
      g.position.lerp(tmpV, kPos);
      scatterQ.setFromEuler(new THREE.Euler(Math.sin(time * 0.3 + ph.phase) * 0.4, time * ph.spin + ph.phase, 0));
      tmpQ.copy(ph.baseQ).slerp(scatterQ, p);
      g.quaternion.slerp(tmpQ, kRot);
      ph.pop *= Math.exp(-dt * 2.5);
      const s = g.scale.x + (1 + ph.pop * 0.35 - g.scale.x) * kPos;
      g.scale.setScalar(s);
    }
  }

  // 音乐律动
  if (analyser && !bgm.paused) {
    analyser.getByteFrequencyData(freq);
    let sum = 0; for (let i = 1; i < 10; i++) sum += freq[i];
    const bass = Math.pow(sum / (9 * 255), 1.6);
    U.uAudio.value += (bass - U.uAudio.value) * (1 - Math.exp(-dt * 12));
  } else U.uAudio.value *= Math.exp(-dt * 3);

  // 星光体积光：跟着树顶星在屏幕上的位置
  if (raysPass.enabled) {
    starGroup.getWorldPosition(tmpV).project(camera);
    const on = tmpV.z < 1 && Math.abs(tmpV.x) < 1.3 && Math.abs(tmpV.y) < 1.3 ? 1 : 0;
    raysPass.uniforms.uLight.value.set(tmpV.x * 0.5 + 0.5, tmpV.y * 0.5 + 0.5);
    const want = on * (0.5 + audio * 0.5) * (revealed ? 1 : 0.4);
    raysPass.uniforms.uStrength.value += (want - raysPass.uniforms.uStrength.value) * (1 - Math.exp(-dt * 3));
  }

  composer.render(dt);
  composeRecording(now);

  // 自动降级：每 1.5 秒看一次平均帧率，连续两次低于目标的 85% 就降一级
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 1.5) {
    const fps = fpsFrames / fpsAcc, want = 1000 / TARGET_MS;
    window.__stats.fps = Math.round(fps); window.__stats.hz = Math.round(1000 / rafInterval); window.__stats.target = Math.round(1000 / TARGET_MS);
    if (qs.has('fps')) setHint(`${Math.round(fps)} fps · ${Math.round(1000 / rafInterval)}Hz · 档 ${quality} · ${(GPU.name.match(/NVIDIA[^,(]*|Intel[^,(]*|AMD[^,(]*/) || [GPU.name])[0].trim()}`, 'live');
    if (revealed && time - revealAt > 2.5 && !qs.has('q')) {
      if (fps < Math.min(want, 1000 / rafInterval) * 0.85) slowWindows++; else slowWindows = 0;
      if (slowWindows >= 2) { slowWindows = 0; if (TARGET_MS < 1000 / 61) TARGET_MS = 1000 / 60; else if (quality < LEVELS.length - 1) { quality++; applyQuality(); } }
    }
    fpsAcc = 0; fpsFrames = 0;
  }
}

// 标志：按进度 p 画（0 = 什么都没有，1 = 完整标志）；描线、填色、挂饰和星分段出现
function drawMark(x, cx, cy, S, p, flash) {

    const [ox, oy, t] = fly(i + 1, [[-70, 40], [80, 30], [-50, -45]][i]); if (t <= 0) return;
    const g = x.createRadialGradient(bx + ox - r * 0.3, by + oy - r * 0.4, 0, bx + ox, by + oy, r * 1.1);

  });

// 字：逐字浮现，每个字亮起时沿字形迸出星光
function makeTextFX(text, font, W, H, cy) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.font = font; x.textBaseline = 'middle';
  const total = x.measureText(text).width, chars = [];
  let cx = W / 2 - total / 2;
  for (const ch of text) { const w = x.measureText(ch).width; chars.push({ ch, x: cx, w }); cx += w; }
  x.fillStyle = '#fff'; chars.forEach(c2 => x.fillText(c2.ch, c2.x, cy));
  const img = x.getImageData(0, 0, W, H).data, pts = [];
  const step = Math.max(2, Math.round(W / 700));
  for (let yy = 0; yy < H; yy += step) for (let xx = 0; xx < W; xx += step) if (img[(yy * W + xx) * 4 + 3] > 140) pts.push([xx, yy]);
  const sparks = [];
  for (let i = 0; i < Math.min(900, pts.length); i++) {
    const [px, py] = pts[Math.floor(Math.random() * pts.length)];
    const li = Math.max(0, chars.findIndex(c2 => px >= c2.x && px < c2.x + c2.w));
    sparks.push({ x: px, y: py, li, d: Math.random() * 0.7, life: 0.9 + Math.random() * 1.4, s: 0.5 + Math.random() * 1.2, vy: -(6 + Math.random() * 22), flare: Math.random() < 0.12 });
  }
  return { chars, sparks, font, cy };
}
function drawTextFX(x, fx, t, start, per, H) {
  // 字形
  x.font = fx.font; x.textBaseline = 'middle';
  fx.chars.forEach((c, i) => {
    const a = ease((t - start - i * per) / 0.9); if (a <= 0) return;
    x.save(); x.globalAlpha = a; x.translate(0, (1 - a) * H * 0.02);
    const g = x.createLinearGradient(0, fx.cy - H * 0.06, 0, fx.cy + H * 0.06);
    g.addColorStop(0, '#fff6d8'); g.addColorStop(0.45, '#f3d27c'); g.addColorStop(1, '#b98a2e');
    x.fillStyle = g; x.shadowColor = 'rgba(233,196,106,.6)'; x.shadowBlur = H * 0.02;
    x.fillText(c.ch, c.x, fx.cy); x.restore();
  });
  // 星光
  x.globalCompositeOperation = 'lighter';
  const u = H / 1600;
  for (const s of fx.sparks) {
    const age = t - (start + s.li * per + s.d); if (age < 0 || age > s.life) continue;
    const k = age / s.life, a = Math.sin(Math.PI * k);
    const sz = (s.flare ? 46 : 16) * s.s * u * (0.6 + 0.8 * a);
    x.globalAlpha = a * 0.9;
    x.drawImage(s.flare ? FLARE : SPARK, s.x - sz / 2, s.y + s.vy * age * u - sz / 2, sz, sz);
  }
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
}

const SEQ = { intro: 4.6, outro: 6.4 };
